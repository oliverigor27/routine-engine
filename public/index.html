<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QG de Rotina — Painel de Execução</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/><path d="m3 7 9 5 9-5"/><path d="M12 12v10"/>
          </svg>
        </div>
        <div>
          <h1 class="brand__title">QG de Rotina</h1>
          <p class="brand__subtitle">Painel de Execução</p>
        </div>
      </div>

      <div class="topbar__meta">
        <span id="data-hoje" class="date"></span>
        <span id="badge-dia" class="badge is-skeleton">Carregando</span>
      </div>
    </header>

    <main class="grid">
      <section class="card card--hero" aria-labelledby="titulo-foco">
        <div class="card__header">
          <span class="eyebrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
            </svg>
            <span id="titulo-foco">Foco principal de hoje</span>
          </span>
        </div>
        <p id="foco-hoje" class="focus is-skeleton">Carregando diretriz do dia…</p>
      </section>

      <section class="card card--progress" aria-labelledby="titulo-progresso">
        <div class="card__header">
          <span class="eyebrow" id="titulo-progresso">Progresso</span>
        </div>
        <div class="progress">
          <svg class="progress__ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="progress__track" cx="60" cy="60" r="52"/>
            <circle id="progress-bar" class="progress__value" cx="60" cy="60" r="52"/>
          </svg>
          <div class="progress__label">
            <strong id="progress-percent">0%</strong>
            <span id="progress-count">0 de 0</span>
          </div>
        </div>
      </section>

      <section class="card card--tasks" aria-labelledby="titulo-tarefas">
        <div class="card__header">
          <div>
            <h2 id="titulo-tarefas" class="card__title">Micro-tarefas</h2>
            <p class="card__subtitle">Sincronizadas com o Obsidian</p>
          </div>
          <button id="btn-recarregar" class="icon-btn" type="button" title="Sincronizar" aria-label="Sincronizar tarefas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/>
            </svg>
          </button>
        </div>

        <ul id="lista-tarefas" class="tasks" aria-live="polite">
          <li class="task task--skeleton"></li>
          <li class="task task--skeleton"></li>
          <li class="task task--skeleton"></li>
        </ul>
      </section>

      <section class="card card--leisure" aria-labelledby="titulo-lazer">
        <div class="card__header">
          <span class="eyebrow eyebrow--alt">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
            <span id="titulo-lazer">Lazer do dia</span>
          </span>
        </div>
        <p id="lazer-hoje" class="leisure is-skeleton">Carregando…</p>
      </section>
    </main>

    <footer class="footer">
      <span class="status" id="status-conexao">
        <span class="status__dot"></span>
        <span class="status__text">Conectando…</span>
      </span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
